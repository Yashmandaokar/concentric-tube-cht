[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concentric-tube-cht"
version = "0.1.0"
description = "Hierarchical analytical and numerical models for concentric-tube conjugate heat transfer"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]